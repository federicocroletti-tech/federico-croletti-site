services:
  - type: web
    name: impact-evidence-vault-cro-dual-funnels-analytics
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:secure
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASIC_AUTH_USERNAME
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false
      - key: AUTH_REALM
        value: Impact Evidence Vault