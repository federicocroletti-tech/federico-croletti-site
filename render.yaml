services:
  - type: web
    name: federico-croletti-site
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist/federico-croletti-site/browser
    routes:
      - type: redirect
        source: /chi-sono
        destination: /chi-sono/
        status: 301
      - type: redirect
        source: /servizi
        destination: /servizi/
        status: 301
      - type: redirect
        source: /progetti
        destination: /progetti/
        status: 301
      - type: redirect
        source: /portfolio
        destination: /progetti/
        status: 301
      - type: redirect
        source: /contatti
        destination: /contatti/
        status: 301
      - type: redirect
        source: /privacy
        destination: /privacy/
        status: 301
      - type: redirect
        source: /cookie-policy
        destination: /cookie-policy/
        status: 301
      - type: rewrite
        source: /*
        destination: /index.html