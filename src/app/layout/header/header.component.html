<a class="skip-link" href="#main-content">Vai al contenuto principale</a>

<header class="site-header">
  <a class="brand" routerLink="/" aria-label="Home">
    <img
      src="/assets/images/brand/federico-mark-primary-header.png"
      alt=""
      aria-hidden="true"
      width="48"
      height="32"
    />
    <span>Federico Croletti</span>
  </a>

  <input class="nav-toggle" id="site-nav-toggle" type="checkbox" aria-hidden="true" />
  <label
    class="nav-toggle-button"
    for="site-nav-toggle"
    aria-label="Apri o chiudi la navigazione principale"
    aria-controls="site-navigation"
  >
    <span aria-hidden="true"></span>
    <span aria-hidden="true"></span>
    <span aria-hidden="true"></span>
  </label>

  <nav id="site-navigation" class="navigation" aria-label="Navigazione principale">
    @for (item of navigationItems; track item.path) {
      <a
        mat-button
        [routerLink]="item.path"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: item.path === '/' }"
      >
        {{ item.label }}
      </a>
    }

    <app-language-switcher class="nav-language" />
  </nav>

  <app-language-switcher class="header-language" />
</header>
