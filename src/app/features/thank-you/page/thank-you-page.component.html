<section class="section thank-you-page" aria-labelledby="thank-you-title">
  <div class="page-heading">
    <p class="eyebrow">Richiesta inviata</p>
    <h1 id="thank-you-title">Grazie, ho ricevuto il tuo messaggio.</h1>
    @if (funnel) {
      <p class="lead">Percorso selezionato: {{ funnel.label }}.</p>
    } @else {
      <p class="lead">Ti rispondero appena possibile usando i contatti che hai indicato.</p>
    }
  </div>

  <div class="cta-row" aria-label="Azioni dopo invio richiesta">
    <a mat-flat-button color="primary" routerLink="/">Torna alla home</a>
    <a mat-stroked-button routerLink="/servizi-frontend">Consulenza Angular</a>
    <a mat-stroked-button routerLink="/assistenza-informatica-milano">Assistenza Milano</a>
  </div>
</section>
